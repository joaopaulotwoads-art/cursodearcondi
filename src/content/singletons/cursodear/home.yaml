aboutTitle: Por que investir agora
aboutText: |-
  A demanda por técnicos de ar condicionado só cresce: residências, comércios e condomínios precisam de profissionais que saibam instalar e manter split com segurança.

  Este curso foi estruturado para você sair do zero com método real — cobrindo ferramentas, elétrica aplicada, linhas frigoríficas, vácuo, diagnóstico e atendimento ao cliente.

  Sem enrolação: cada módulo é direto ao ponto, para você aprender e já aplicar.
